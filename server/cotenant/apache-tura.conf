# One name on the existing Apache, proxied to the loopback notes-server.
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   sudo install -m 0644 server/cotenant/apache-tura.conf \
#        /etc/apache2/sites-available/tura.samirhv.com.br.conf
#   sudo a2ensite tura.samirhv.com.br && sudo apachectl configtest && sudo systemctl reload apache2
#
# tura.samirhv.com.br currently answers from whatever this server's DEFAULT
# vhost is — a Matomo instance, at the time of writing — because no vhost claims
# the name. That is what this file is for. Until it exists, a certificate
# request and a pairing attempt are both aimed at the wrong application.
#
# Every header below is load-bearing. See docs/SERVER-0.5.md; the behaviour they
# depend on is asserted in server/tests/cotenant.py.

<VirtualHost *:80>
    ServerName tura.samirhv.com.br
    # Leave ACME reachable, then send everything else to TLS.
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Location "/.well-known/acme-challenge/">
        ProxyPass !
        Require all granted
    </Location>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName tura.samirhv.com.br

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/tura.samirhv.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tura.samirhv.com.br/privkey.pem

    # A note is capped at 8 MiB and a request body at 16 MiB. Apache's default is
    # unlimited, so this is the bound, not a relaxation of one.
    LimitRequestBody 16777216

    ProxyPreserveHost On
    ProxyTimeout 120

    # REQUIRED. NOTES_SERVER_TRUSTED_PROXY makes the server refuse every route
    # without it — /healthz included, since the health route is checked after
    # the proxy gate rather than in front of it. mod_proxy sets X-Forwarded-For
    # and X-Forwarded-Host on its own but never this one.
    #
    # It is an assertion, not an observation: Apache sends it whether or not the
    # hop in front of it was encrypted. With Cloudflare proxying this name, that
    # makes Cloudflare's SSL mode load-bearing — see docs/SERVER-0.5.md.
    RequestHeader set X-Forwarded-Proto "https"

    # The API refuses any request carrying Origin: a machine API with no CORS,
    # and cookies with no authority. Strip it so a browser pointed at this name
    # cannot turn a real client's request into a 403.
    RequestHeader unset Origin

    ProxyPass        / http://127.0.0.1:8787/
    ProxyPassReverse / http://127.0.0.1:8787/
</VirtualHost>
