# One name on the existing Apache, proxied to the loopback notes-server.
#
# THIS FILE IS HTTP-ONLY, AND THAT IS THE POINT ON A HOST THAT USES CERTBOT.
# `certbot --apache` reads an enabled HTTP vhost, clones it into
# `<name>-le-ssl.conf` with the certificate directives, and adds the redirect.
# Writing the `<VirtualHost *:443>` by hand instead points Apache at a
# certificate file that does not exist yet, and Apache then refuses to start —
# taking every other site on that machine down with it. On a co-tenant host
# that is the one mistake that hurts somebody other than you.
#
#   sudo a2enmod proxy proxy_http headers
#   sudo install -m 0644 server/cotenant/apache-tura.conf \
#        /etc/apache2/sites-available/tura.samirhv.com.br.conf
#   sudo a2ensite tura.samirhv.com.br
#   sudo apachectl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d tura.samirhv.com.br
#
# If you issue certificates some other way, copy this vhost to *:443, add
# SSLEngine/SSLCertificateFile/SSLCertificateKeyFile, and enable it only once
# the certificate is on disk.
#
# BEHIND A PROXYING CDN (Cloudflare, which is what tura.samirhv.com.br has):
# HTTP-01 is answered by whatever the CDN forwards it to, so set the record to
# DNS-only for the issuance and turn the proxy back on afterwards — or use
# DNS-01. And see docs/SERVER-0.5.md on why the CDN's SSL mode has to be
# Full (strict): the X-Forwarded-Proto below is an assertion, not an
# observation, and Flexible makes it a false one.
#
# Every header is load-bearing; the behaviour they depend on is asserted in
# server/tests/cotenant.py.

<VirtualHost *:80>
    ServerName tura.samirhv.com.br

    # A note is capped at 8 MiB and a request body at 16 MiB. Apache's default
    # is unlimited, so this is the bound, not a relaxation of one.
    LimitRequestBody 16777216

    ProxyPreserveHost On
    ProxyTimeout 120

    # REQUIRED. NOTES_SERVER_TRUSTED_PROXY makes the server refuse every route
    # without it — /healthz included, since the health route is checked after
    # the proxy gate rather than in front of it. mod_proxy sets X-Forwarded-For
    # and X-Forwarded-Host on its own but never this one.
    RequestHeader set X-Forwarded-Proto "https"

    # The API refuses any request carrying Origin: a machine API with no CORS,
    # and cookies with no authority. Strip it so a browser pointed at this name
    # cannot turn a real client's request into a 403.
    RequestHeader unset Origin

    # certbot needs this path served from disk, not proxied away.
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    ProxyPass        / http://127.0.0.1:8787/
    ProxyPassReverse / http://127.0.0.1:8787/
</VirtualHost>
