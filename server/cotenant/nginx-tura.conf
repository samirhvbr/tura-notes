# One name on an existing nginx, proxied to the loopback notes-server.
#   sudo install -m 0644 server/cotenant/nginx-tura.conf \
#        /etc/nginx/sites-available/tura.samirhv.com.br
#   sudo ln -s ../sites-available/tura.samirhv.com.br /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# tura.samirhv.com.br currently answers from this server's DEFAULT vhost — a
# Matomo instance, at the time of writing — because no vhost claims the name.
# That is what this file is for. Obtain the certificate for the name once this
# site is enabled (certbot --nginx -d tura.samirhv.com.br); on another host,
# the hostname is the one thing to change.
#
# Every `proxy_set_header` below is load-bearing. See docs/SERVER-0.5.md; the
# behaviour they depend on is asserted in server/tests/cotenant.py.

server {
    listen 80;
    listen [::]:80;
    server_name tura.samirhv.com.br;
    # ACME renewal keeps working through the existing site's well-known root.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tura.samirhv.com.br;

    ssl_certificate     /etc/letsencrypt/live/tura.samirhv.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tura.samirhv.com.br/privkey.pem;

    # A note is capped at 8 MiB and a request body at 16 MiB. nginx defaults to
    # 1 MiB and answers 413 itself, so an attachment bundle fails before the
    # server ever sees it — with an error page that names nginx, not the limit.
    client_max_body_size 16m;

    # Leave request buffering ON (the default). The server gives a body 15
    # seconds to arrive; nginx buffering absorbs a slow uploader on a phone,
    # which is exactly the client this exists for.

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # REQUIRED. NOTES_SERVER_TRUSTED_PROXY makes the server refuse every
        # route without it — including /healthz, which is behind the gate rather
        # than in front of it. A front that forgets this line produces a server
        # that answers 403 to the probe you would use to diagnose it.
        proxy_set_header X-Forwarded-Proto https;

        # REQUIRED for the rate limit to mean anything. nginx does not send
        # this unless told to, and without it the server charges the 120/min
        # per-address budget to nginx itself — which makes it the budget of
        # every device put together. Apache's mod_proxy and Caddy append it on
        # their own; nginx is the one that needs the line.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The API refuses any request that carries Origin: it is a machine API
        # with no CORS and cookies with no authority. Stripping it here means a
        # browser pointed at this name cannot turn a real client's request into
        # a 403 by arriving through a shared connection.
        proxy_set_header Origin "";

        # Sync transfers a revision at a time; the ceiling is the body limit
        # above, not the clock.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
