name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, for the advisories job below: an advisory is published against code
  # that has not changed, so a check that runs only on our commits learns about
  # it whenever we happen to commit next. The rest of the workflow coming along
  # is not waste — a suite that has not run in a fortnight is a suite nobody
  # knows the state of.
  schedule:
    - cron: "17 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  # The two checks that catch a whole class of mistake without building the app.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`, and only on this job. `tools/changelog-versions.py`
      # asks whether some commit ever carried each version in `CHANGELOG.md`,
      # which it answers with `git log -p -- version.md`. The default shallow
      # checkout has one commit, so every heading but the newest reads as
      # uncommitted — 264 false failures on the run that added the check. The
      # other jobs stay shallow: none of them looks at history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      # docs/ARCHITECTURE.md §12: "No `fs:*` permission exists in the file. A PR
      # that adds one is rejected by a CI grep." The frontend has no filesystem
      # capability; every read and write goes through a command that validates
      # the resolved path against the root itself.
      - name: the webview has no filesystem capability
        run: |
          if grep -rnE '"fs:[a-z-]+"' apps/notes-app/src-tauri/capabilities/; then
            echo "::error::a capability file grants an fs permission — see docs/ARCHITECTURE.md §12"
            exit 1
          fi
          echo "no fs capability granted"

      # docs/ARCHITECTURE.md §7: the frontend never hand-writes an IPC type.
      # Regenerating must be a no-op; if it is not, Rust and TypeScript disagree
      # about the wire and one of them is wrong.
      - name: the generated TypeScript matches the Rust types
        run: |
          rm -rf apps/notes-app/src/ipc/generated
          # Only the crates that export types, and only their `--lib` target.
          # `--workspace` would build the Tauri app and need GTK and WebKit on a
          # job whose whole point is that it does not; the integration suites are
          # `rust (ubuntu-latest)`'s job, and running them a second time here
          # bought nothing but a second chance to be flaky. `#[ts(export)]`
          # generates its writer as a lib test, so `--lib` still emits all 51.
          #
          # The output is NOT discarded: this step failed once with `>/dev/null`
          # and the log said only "test failed", which is the one moment the
          # output is worth having.
          cargo test -p notes-model -p notes-core -p notes-markdown -p notes-sync-client --lib
          # Two questions, because one command answers only half of it: a diff
          # sees a changed file, and a type introduced by a new crate arrives
          # *untracked*, which a diff cannot see at all.
          if ! git diff --quiet --exit-code -- apps/notes-app/src/ipc/generated \
             || [ -n "$(git ls-files --others --exclude-standard -- apps/notes-app/src/ipc/generated)" ]; then
            echo "::error::ipc/generated is stale — run cargo test and commit the result"
            git --no-pager status --porcelain -- apps/notes-app/src/ipc/generated
            exit 1
          fi
          test -n "$(ls -A apps/notes-app/src/ipc/generated)" || { echo "::error::nothing was generated"; exit 1; }
          echo "generated types are in step with the Rust"

      # AA for every text/surface pair, and three dark levels a cheap panel can
      # still tell apart. Nine pairs before the accent — a number nobody
      # re-checks by eye after changing one hex digit (docs/ACCEPTANCE-0.1d.md).
      - name: the palette meets AA and its levels are distinguishable
        run: tools/contrast.sh --table

      # A browser's blocking script dialog compiles, ships, and does nothing in
      # the WebView — six flows of 0.1b were behind one, and no core test could
      # have known.
      - name: no blocking script dialogs in the frontend
        run: tools/no-blocking-dialogs.sh

      # The bundle version is stamped from version.md at build time (ADR-035).
      # A real number committed here is a second copy of the version, and it is
      # the copy that goes stale — a `.deb` on Release 0.11.1 calling itself
      # 0.1.0 is a package nobody can match to the code that produced it.
      - name: the bundle version is the placeholder, not a stamped one
        run: |
          if ! grep -q '"version": "0.0.0"' apps/notes-app/src-tauri/tauri.conf.json; then
            echo "::error::tauri.conf.json carries a stamped version — it must be committed as 0.0.0"
            grep '"version"' apps/notes-app/src-tauri/tauri.conf.json
            exit 1
          fi
          echo "bundle version is the placeholder"

      # Every user-visible string is a key, and a key missing from either
      # catalogue is a blank label in one language (scope §9). Parity alone let
      # a key used by the code and defined in NEITHER catalogue through: `t()`
      # returns the key, so the dialog rendered `tree.newNote.prompt` as body
      # text (1.1.31). This resolves them.
      - name: every t() key resolves in both catalogues
        run: python3 tools/i18n-keys.py

      # WHY THESE ARE HERE AND NOT ONLY IN `tools/check.sh`. The local gate and
      # this job are two lists of the same contracts, and lists drift: every
      # check below existed in `check.sh` and in no workflow, so a pull request
      # that broke one was merged green. A check that only runs when somebody
      # remembers to run it is a convention, not a gate.
      #
      # `server/tests/cotenant.py` is deliberately NOT here: it needs
      # `target/debug/notes-server` on disk, and this job's whole premise is
      # that it builds nothing. It runs in `server HTTPS container`, which
      # already has a toolchain and is about the server anyway.
      #
      # They are grouped in one step on purpose. As separate steps the first
      # failure hides the rest, and the answer to "what else is broken" costs
      # another push; here every one of them reports, and the step fails if any
      # did. All are pure python3/bash — no toolchain, no system package, no
      # network — which is why they belong in the job that deliberately does not
      # build the application.
      - name: the contracts the local gate checks and this job did not
        run: |
          fail=0
          run() {
            printf '\n== %s\n' "$1"; shift
            if "$@"; then echo '   ok'; else echo "::error::$*"; fail=1; fi
          }
          run "a serde wrapper declares its wire shape"  python3 tools/ts-serde.py
          run "every document declares one of the five statuses" tools/doc-status.sh
          run "Linux packaging orchestration"           python3 tools/tests/test_build_linux.py
          run "updater publication"                     python3 tools/tests/test_updater_release.py
          run "macOS build script"                      python3 tools/tests/test_build_local.py
          run "the self-hosting guide matches the code" python3 tools/tests/test_selfhosting_doc.py
          run "the env report is not a hand-written IPC shape" python3 tools/tests/test_env_report.py
          run "every relative documentation link resolves" python3 tools/doc-links.py
          run "every ADR status is one of the four words"  python3 tools/adr-status.py
          run "every docs/ page is in the index"           python3 tools/doc-index.py
          run "this job runs what the local gate runs"     python3 tools/ci-parity.py
          run "a cited range matches the rows it names" python3 tools/doc-ranges.py
          run "every changelog version exists"       python3 tools/changelog-versions.py
          exit "$fail"

  server-container:
    name: server HTTPS container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: validate the versioned API contract
        run: |
          pip install openapi-spec-validator==0.7.2
          openapi-spec-validator server/notes-server/openapi.json
      - name: build and start the private backend with a TLS proxy
        env:
          NOTES_DOMAIN: localhost
          NOTES_HTTP_PORT: '8080'
          NOTES_HTTPS_PORT: '8443'
        run: |
          docker compose -f server/compose.yml -f server/tests/compose.yml config --quiet
          docker compose -f server/compose.yml -f server/tests/compose.yml up -d --build
          for attempt in $(seq 1 60); do
            docker compose -f server/compose.yml exec -T caddy test -f /data/caddy/pki/authorities/local/root.crt && break
            sleep 1
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the device sync client
        run: cargo build -p notes-sync-client --locked
      # The co-tenant unit, the Apache/nginx/Caddy templates and the credential
      # wrapper the site's admin screen calls. It runs here rather than in
      # `contracts` because it starts a real `notes-server` on loopback, and an
      # Apache template that would take the other eight sites on that host down
      # is not something a diff shows you.
      # `cotenant.py` signs and verifies a throwaway artifact with a real
      # `minisign`, which is the only honest way to test the deploy's refusal
      # path (ADR-081). The runner does not ship it, and without this line the
      # step dies on a `FileNotFoundError` before reaching anything it is about.
      # That is what happened: this job was red from `1.6.0`, the commit that
      # added the signature check, until `1.6.52` — forty-seven consecutive runs
      # — while the local gate stayed green because the owner had installed
      # `minisign` on that machine.
      - name: install the signature tool the co-tenant check needs
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: the co-tenant templates and the credential wrapper
        run: |
          cargo build -p notes-server --locked
          python3 server/tests/cotenant.py
      # 0.7's only end-to-end proof. It starts its own `target/debug/notes-server`
      # on loopback with its own rate buckets, so it belongs beside `cotenant.py`
      # rather than in the container step: both want the binary this job has
      # already built, and neither wants the compose stack.
      - name: the remote MCP transport answers at POST /v1/mcp
        run: python3 server/tests/mcp.py
      - name: authenticated CRUD over verified HTTPS
        run: python3 server/tests/smoke.py --compose
      - name: stop disposable services
        if: always()
        env:
          NOTES_DOMAIN: localhost
        run: docker compose -f server/compose.yml -f server/tests/compose.yml down --volumes

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

      # The byte-preservation criterion in its literal form: git is the only
      # thing that can answer "git sees no change".
      - run: tools/byte-preservation.sh
        shell: bash

      # The one-second rule (ADR-034), against the corpus it was measured on
      # rather than the smaller one the ordinary suite builds for itself.
      # `fixtures/deep` is ~21 000 directories with a mode-000 directory and a
      # symlink loop in it, and it is generated rather than committed (ADR-011).
      #
      # Linux only: the per-directory walk, the watch table and the unreadable
      # count are inotify's (docs/DECISIONS-0.1c.md D-10), and this runner is
      # the only one in the matrix that is not root — root reads a mode-000
      # directory anyway, which is what the Arch job taught at 0.11.3.
      - name: the one-second rule on ~21 000 directories
        if: runner.os == 'Linux'
        run: |
          tools/gen-deep.sh
          cargo test -p notes-core --test deep -- --ignored --nocapture \
            where_the_time_goes_opening_a_workspace_full_of_directories

      # The full-disk criterion, on a filesystem that really is full — see
      # docs/DECISIONS-0.1b.md D-03. Linux only: the mechanism is a Linux one.
      #
      # `NOTES_REQUIRE_ENOSPC` turns "no mechanism available" into a failure.
      # The script prefers an unprivileged user namespace, which needs nothing
      # from the runner, and falls back to `sudo mount -t tmpfs` — which is what
      # this runner actually needs, because Ubuntu 24.04 ships
      # `apparmor_restrict_unprivileged_userns=1`. Without the variable a
      # runner that lost both would skip in silence, which is the failure mode
      # D-01 exists to refuse.
      - name: full disk (ENOSPC)
        if: runner.os == 'Linux'
        env:
          NOTES_REQUIRE_ENOSPC: "1"
        run: tools/enospc.sh

  # Arch is rolling: WebKitGTK moves without warning, and breakage shows here
  # before it reaches a user (docs/ARCHITECTURE.md §3).
  arch:
    name: rust (arch, rolling webkit2gtk)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel rustup webkit2gtk-4.1 gtk3 nodejs npm git
          rustup default stable
      - run: cargo test --workspace

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/notes-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/notes-app/package-lock.json
      - run: npm ci
      - run: node --test ../../tools/tauri.test.mjs
      - run: npm run typecheck
      # `vitest` for the pieces of the frontend that are logic rather than
      # markup (docs/ARCHITECTURE.md §14). The conflict diff is the first:
      # it decides what a user sees at the moment they choose which version of
      # their work to keep.
      - run: npm test -- --run
      - run: npm run build

  # The acceptance criterion that needs a thousand kills. Not on every push:
  # it takes minutes, and a check that slows every PR becomes a check people
  # learn to skip.
  crash:
    name: crash-save-loop
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-crash-loop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: tools/crash-save-loop.sh

  # Dependabot opens pull requests for new versions; it does not say whether the
  # version we are pinned to has a known vulnerability. `security.md` §10 names
  # dependency maintenance as a control, and until now nothing checked it.
  #
  # It runs on the weekly schedule as well as on push, for the reason at the top
  # of this file.
  advisories:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      # The lockfile is what ships, so the lockfile is what is audited.
      - name: rust advisories
        run: cargo audit --deny warnings
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # `--audit-level=high` and not `low`: a moderate advisory in a build-time
      # dependency of a desktop application that opens no port is a queue item,
      # and a gate that is red for one of those is a gate people learn to
      # override.
      - name: frontend advisories
        run: npm audit --audit-level=high
        working-directory: apps/notes-app

  android-core:
    name: Android core
    # The twin of ios-core, and it exists because ACCEPTANCE-0.4.md claimed
    # compilation evidence for iOS and had none for Android — while Android is
    # the half that can actually be built without Apple hardware. All four ABIs,
    # because `notes-index` bundles SQLite and a C cross-compile is exactly the
    # thing that breaks per-ABI rather than once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: check the shared core including SQLite for every Android ABI
        run: |
          set -euo pipefail
          # The runner ships an NDK; its path is exported for us, and pinning a
          # version here would rot faster than the image does.
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:?no NDK on this runner}}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -d "$bin" || { echo "no NDK toolchain at $bin" >&2; exit 1; }
          export PATH="$bin:$PATH"
          # API 24 is the floor Tauri's Android template targets.
          for target in aarch64-linux-android:aarch64-linux-android24-clang \
                        armv7-linux-androideabi:armv7a-linux-androideabi24-clang \
                        i686-linux-android:i686-linux-android24-clang \
                        x86_64-linux-android:x86_64-linux-android24-clang; do
            t="${target%%:*}"; cc="${target##*:}"
            u="$(echo "$t" | tr 'a-z-' 'A-Z_')"; l="$(echo "$t" | tr '-' '_')"
            export "CARGO_TARGET_${u}_LINKER=$cc" "CC_${l}=$cc" "AR_${l}=llvm-ar"
            echo "== $t"
            cargo check --locked --target "$t" -p notes-model -p notes-fs -p notes-markdown -p notes-index -p notes-core
          done
          # The Tauri shell on one ABI rather than four. The reason the core is
          # checked on all of them is SQLite's C cross-compile, which breaks per
          # architecture; the shell is Rust over a JNI boundary and does not, so
          # four full Tauri dependency trees would buy repetition rather than
          # coverage. arm64 is what a real device runs.
          echo "== notes-app on aarch64-linux-android"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android24-clang
          export CC_aarch64_linux_android=aarch64-linux-android24-clang
          export AR_aarch64_linux_android=llvm-ar
          cargo check --locked --target aarch64-linux-android -p notes-app

  ios-core:
    name: iOS simulator core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: check the shared core including SQLite for iOS
        run: cargo check --locked --target aarch64-apple-ios-sim -p notes-model -p notes-fs -p notes-markdown -p notes-index -p notes-core
