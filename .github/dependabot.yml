# Dependency PRs are reviewed and squashed with the repository's versioned,
# English commit subject; Dependabot cannot stamp version.md itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/apps/notes-app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # react-dom refuses to start when its version differs from react's by even a
    # patch, so a PR that moves only one of them fails every component test (#130).
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
  - package-ecosystem: docker
    directory: "/server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker-compose
    directory: "/server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
