[package]
name = "notes-ai"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
# The same pinned client and TLS stack as `notes-sync-client`, for the same
# reason: one HTTP stack in the application, with redirects off and no
# platform proxy surprises (ADR-100 keeps every call in Rust).
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
