[package]
name = "notes-ai"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
# The same pinned client and TLS stack as `notes-sync-client`, for the same
# reason: one HTTP stack in the application, with redirects off and no
# platform proxy surprises (ADR-100 keeps every call in Rust).
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The system keychain: Keychain on macOS, Credential Manager on Windows, the
# Secret Service on Linux (over D-Bus in pure Rust, so no system library is
# needed to build). ADR-100: a key is never written to a file.
keyring = "4"

# iOS has one secure store, the "protected data" keychain, and the crate refuses
# to compile there unless that feature is on (it is a compile_error!, not a
# runtime failure). `keyring`'s `v1` mode does not pick a store on iOS by
# itself, so `keychain.rs` installs this one through `keyring-core`, the layer
# `keyring` wraps.
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }
keyring-core = "1"
